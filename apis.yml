description: Sav Technologies Limited operates Sav (sav.money), a UAE-based intelligent
  financial platform that lets users track, save, invest, and grow their wealth across
  accounts. Sav offers a suite of consumer products including Gold (physical gold
  investment from AED 10), MyMoney (financial management and savings), Card (a prepaid
  card with cashback), Wealth (investing), Sav Pro (premium membership), and an upcoming
  Credit product. Sav describes itself as extending the APIs and technology components
  of licensed financial services providers to its users. It is a 500 Global portfolio
  company. As of this enrichment pass, Sav publishes a consumer app and marketing
  site but no public developer API, API documentation, developer portal, or SDKs.
